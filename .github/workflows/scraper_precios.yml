# Reporte quincenal de precios de la competencia (dia 1 y 15, 09:00 UTC).
# Envia el reporte por correo a ventas@ y lo deja como artefacto de la ejecucion
# (Actions -> la ejecucion -> Artifacts) durante 90 dias. No guarda nada en el repo:
# main solo acepta cambios por PR, y el repo es publico.
# GitHub desactiva los horarios tras 60 dias sin actividad en el repo: se reactiva
# con `gh workflow enable scraper_precios.yml`.

name: Scraper de precios competencia

on:
  schedule:
    - cron: "0 9 1,15 * *"   # Quincenal: dia 1 y 15 de cada mes a las 09:00 UTC
  workflow_dispatch:
    inputs:
      scraper_mode:
        description: "Modo: auto (solo PowerEnergy) o all (todos)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - all

jobs:
  scraper-precios:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # PowerEnergy: ~800 fichas, una por segundo
    permissions:
      contents: read
    env:
      SCRAPER_MODE: ${{ github.event.inputs.scraper_mode || 'auto' }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml
      - name: Crear directorio data
        run: mkdir -p scripts/data
      - name: Ejecutar scraper
        run: python scripts/scraper_precios.py
      - name: Guardar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-precios-competencia
          path: |
            scripts/data/reporte_precios.md
            scripts/data/precios_competencia.json
          retention-days: 90
      - name: Enviar reporte por email
        # Fijada por SHA (tag v3): accion de terceros que recibe la clave de Gmail.
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: Reporte quincenal de precios competencia - eLights
          to: ventas@elights.cl
          from: GitHub Actions <${{ secrets.GMAIL_USER }}>
          body: |
            Hola,

            Se adjunta el reporte actualizado de precios de competidores.
            Modo de ejecucion: ${{ github.event.inputs.scraper_mode || 'auto' }}

            Nota: En modo "auto" solo se capturan datos de PowerEnergy.
            Para datos de Megabright y TecnoIluminacion, ejecutar manualmente
            con modo "all" desde una IP residencial.

            Saludos,
            Bot de monitoreo de precios eLights
          attachments: |
            scripts/data/reporte_precios.md
            scripts/data/precios_competencia.json
