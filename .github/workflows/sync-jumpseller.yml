# Sincronización del catálogo con Jumpseller (Etapa 1, PR 5).
# Se ejecuta A MANO (Actions → "Sincronizar catálogo Jumpseller" → Run workflow) o
# con `gh workflow run sync-jumpseller.yml`. Nunca publica directo: abre o actualiza
# una PR (rama bot/jumpseller-sync) con el informe de cambios para que el dueño la
# revise y la apruebe. Solo workflow_dispatch: el repositorio es público, nunca usar
# pull_request_target aquí.
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   JUMPSELLER_LOGIN, JUMPSELLER_TOKEN
# Y en Settings → Actions → General: "Allow GitHub Actions to create and approve
# pull requests".

name: Sincronizar catálogo Jumpseller

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Comparar contra (auto = snapshot anterior si existe; legacy = src/data/products.ts)'
        type: choice
        options: [auto, legacy, snapshot]
        default: auto

concurrency:
  group: jumpseller-sync
  cancel-in-progress: false

permissions:
  contents: write        # rama bot/jumpseller-sync
  pull-requests: write   # abrir/actualizar la PR
  actions: write         # disparar las verificaciones sobre la PR del bot

jobs:
  sync:
    name: Sincronizar y proponer cambios
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sincronizar con Jumpseller (solo lectura)
        env:
          JUMPSELLER_LOGIN: ${{ secrets.JUMPSELLER_LOGIN }}
          JUMPSELLER_TOKEN: ${{ secrets.JUMPSELLER_TOKEN }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          ARGS="--write"
          if [ "$BASELINE" = "legacy" ] || { [ "$BASELINE" = "auto" ] && [ ! -f src/data/catalog/jumpseller-snapshot.generated.ts ]; }; then
            ARGS="$ARGS --baseline legacy"
          elif [ "$BASELINE" = "snapshot" ]; then
            ARGS="$ARGS --baseline snapshot"
          fi
          npm run -s sync:catalog -- $ARGS

      - name: Informe en el resumen de la ejecución
        if: always()
        run: |
          if [ -f reports/jumpseller-sync/diff.md ]; then cat reports/jumpseller-sync/diff.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Type check
        run: npm run typecheck

      - name: Tests (frontend + api)
        run: |
          npm test
          npx vitest run --config vitest.api.config.ts

      - name: Build
        run: npm run build

      - name: Abrir o actualizar la PR de sincronización
        id: cpr
        # Fijada por SHA (v8.1.1): acción de terceros con permiso de escritura.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: bot/jumpseller-sync
          delete-branch: true
          # Solo los archivos generados: el build también reescribe public/sitemap.xml.
          add-paths: |
            src/data/catalog/jumpseller-snapshot.generated.ts
            src/data/catalog/categories.generated.ts
            api/_lib/catalog/price-index.generated.ts
          commit-message: 'chore(catalog): sincronización con Jumpseller'
          title: 'Catálogo: sincronización con Jumpseller'
          body-path: reports/jumpseller-sync/diff.md

      - name: Correr las verificaciones sobre la PR del bot
        # Las PR creadas con GITHUB_TOKEN no disparan otros workflows; workflow_dispatch
        # sí está permitido, y reporta los checks sobre el mismo commit de la PR.
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run typecheck.yml --ref bot/jumpseller-sync

      - name: Resultado
        if: always()
        env:
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          case "$OPERATION" in
            created|updated) echo "PR de sincronización: $PR_URL" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Sin cambios en el catálogo: no se abrió PR." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
